<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирование — Банный салон «Парная»</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">

  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Банный салон</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Переключить навигацию"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="catalog.html">Наши бани</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="product.html">Баня</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="order.html">Бронирование</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Основной контент -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0">Форма бронирования</h1>
          </div>
          <div class="card-body">
            <div class="alert alert-info" role="alert">
              Заполните форму. Поля со звёздочкой обязательны для заполнения.
            </div>
            <form>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="order-name" class="form-label">Имя *</label>
                  <input id="order-name" name="name" type="text" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-email" class="form-label">E-mail *</label>
                  <input id="order-email" name="email" type="email" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-phone" class="form-label">Телефон</label>
                  <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input id="order-phone" name="phone" type="tel" class="form-control" placeholder="900 000-00-00">
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-bath" class="form-label">Баня</label>
                  <select id="order-bath" name="bath" class="form-select">
                    <option selected>Выберите баню</option>
                    <option value="bereza">Баня «Берёзка»</option>
                    <option value="dubok">Баня «Дубок»</option>
                    <option value="lipa">Баня «Липа»</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-date" class="form-label">Дата</label>
                  <input id="order-date" name="date" type="date" class="form-control">
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-hours" class="form-label">Количество часов</label>
                  <select id="order-hours" name="hours" class="form-select">
                    <option value="1">1 час</option>
                    <option value="2" selected>2 часа</option>
                    <option value="3">3 часа</option>
                    <option value="4">4 часа</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="order-comment" class="form-label">Комментарий</label>
                  <textarea id="order-comment" name="comment" class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input id="order-agree" class="form-check-input" type="checkbox" required>
                    <label class="form-check-label" for="order-agree">
                      Я согласен на обработку данных *
                    </label>
                  </div>
                </div>
                <div class="col-12 d-flex gap-2">
                  <button class="btn btn-primary" type="submit">Отправить заявку</button>
                  <button class="btn btn-outline-secondary" type="reset">Очистить</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Подвал -->
  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-12 col-md-6">
          <p class="mb-0">&copy; 2026 Банный салон «Парная». Учебный проект.</p>
        </div>
        <div class="col-12 col-md-6 text-md-end">
          <a class="text-white text-decoration-none me-3" href="catalog.html">Наши бани</a>
          <a class="text-white text-decoration-none" href="order.html">Бронирование</a>
        </div>
      </div>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
